name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests (engines)
        run: gradle :shared:testDebugUnitTest --no-daemon
        continue-on-error: true  # report-only until the first green run; flip to blocking after

      - name: Build debug APK
        run: gradle :androidApp:assembleDebug --no-daemon 2>&1 | tee build.log

      # Compile errors otherwise sit in the raw log (admin-only); surface them as check annotations.
      - name: Surface build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|requires libraries|depends on" build.log | head -30 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::error::${line:0:400}"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk

  # Boots the APK on an emulator and hammers it with random input; any crash fails the job.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true  # visible, but doesn't block the release until it has proven stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: aether-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/smoke.sh apk/androidApp-debug.apk

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            logcat.txt
            monkey.txt
            crashes.txt
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: aether-debug-apk
          path: apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/androidApp-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
